  <rect x="920" y="210" width="276" height="236" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="948" y="254" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">STAGE 03</text>
  <text x="948" y="294" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">PR Review Gate</text>
  <text x="948" y="334" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Human approval before</text>
  <text x="948" y="362" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">branch merge or release</text>
  <text x="948" y="414" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Human-in-the-loop</text>

  <line x1="1196" y1="328" x2="1246" y2="328" stroke="#5E6673" stroke-width="2.5"/>
