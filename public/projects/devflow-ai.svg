<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0B0D11"/>
  <rect x="64" y="56" width="1472" height="888" rx="12" fill="#101319" stroke="#252A34" stroke-width="2"/>
  <line x1="64" y1="136" x2="1536" y2="136" stroke="#252A34" stroke-width="2"/>
  <text x="104" y="104" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="1">SPEC 02 / AGENT ORCHESTRATION &amp; SDLC PIPELINE</text>
  <text x="1496" y="104" text-anchor="end" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">DEVFLOW AI</text>

  <!-- Horizontal SDLC Flow Nodes -->
  <!-- Stage 1 -->
  <rect x="104" y="210" width="300" height="236" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="132" y="254" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">STAGE 01</text>
  <text x="132" y="294" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">Repository Context</text>
  <text x="132" y="334" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">GitHub issues, commits,</text>
  <text x="132" y="362" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">and codebase structure</text>
  <text x="132" y="414" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">GitHub API</text>

  <line x1="404" y1="328" x2="458" y2="328" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="454,320 470,328 454,336" fill="#38BDF8"/>

