  <text x="176" y="684" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Web Workspace</text>
  <text x="176" y="722" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Next.js App Router + TypeScript</text>
  <text x="176" y="754" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Unified issue, plan, and PR views</text>
  <text x="176" y="818" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">FRONTEND SURFACE</text>

  <rect x="594" y="636" width="412" height="216" rx="8" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="626" y="684" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Cloud Run Workers</text>
  <text x="626" y="722" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Isolated stateless task runners</text>
  <text x="626" y="754" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Bounded token &amp; timeout budgets</text>
  <text x="626" y="818" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">EXECUTION PLANE</text>

  <rect x="1044" y="636" width="412" height="216" rx="8" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1076" y="684" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Firebase State &amp; Auth</text>
  <text x="1076" y="722" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Workspace identity and live state</text>
  <text x="1076" y="754" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Execution traces and audit trail</text>
  <text x="1076" y="818" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">PERSISTENCE LAYER</text>
