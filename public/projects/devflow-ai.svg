  <rect x="472" y="196" width="380" height="264" rx="10" fill="#141922" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="504" y="242" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">STAGE 02 / ORCHESTRATOR</text>
  <text x="504" y="282" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Agent Workflow Engine</text>
  <rect x="504" y="308" width="316" height="44" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="522" y="336" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">1. Task Planning Agent</text>
  <rect x="504" y="362" width="316" height="44" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="522" y="390" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">2. Code Generation Worker</text>
  <text x="504" y="438" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LLM APIs + Tool Boundaries</text>

  <line x1="852" y1="328" x2="906" y2="328" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="902,320 918,328 902,336" fill="#38BDF8"/>

