  <rect x="1260" y="210" width="236" height="236" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1288" y="254" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">STAGE 04</text>
  <text x="1288" y="294" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">Sprint Board</text>
  <text x="1288" y="334" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Synced issue</text>
  <text x="1288" y="362" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">state tracking</text>
  <text x="1288" y="414" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Planned</text>

  <!-- Bottom Infrastructure Plane -->
  <line x1="662" y1="460" x2="662" y2="544" stroke="#5E6673" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="104" y="548" width="1392" height="348" rx="10" fill="#0B0D11" stroke="#252A34" stroke-width="2"/>
  <text x="144" y="600" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">RUNTIME &amp; SERVICE TOPOLOGY (IN DEVELOPMENT)</text>

