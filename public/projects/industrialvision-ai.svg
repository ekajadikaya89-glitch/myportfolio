  <text x="1068" y="728" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">Contract &amp; Integration Tests</text>
  <text x="1068" y="764" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">Automated backend &amp; UI validation</text>
  <text x="1068" y="792" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">verified in repository CI pipeline</text>
