  <text x="620" y="374" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PASS · FAIL · REVIEW · ERROR</text>
  <rect x="596" y="408" width="408" height="86" rx="8" fill="#141922" stroke="#2E3645" stroke-width="1.5"/>
  <text x="620" y="440" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Live WebSocket Event Stream</text>
