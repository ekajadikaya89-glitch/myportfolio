  <text x="176" y="764" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">Inspection history, model versions,</text>
  <text x="176" y="792" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">and immutable decision evidence</text>
  <text x="176" y="832" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PERSISTENCE</text>

