  <rect x="1180" y="196" width="316" height="320" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1212" y="244" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DISTRIBUTION</text>
  <text x="1212" y="284" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">Multi-Outlet POS</text>
  <text x="1212" y="324" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Outlet stock visibility</text>
  <text x="1212" y="352" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">synchronized with</text>
  <text x="1212" y="380" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">central warehouse</text>
  <rect x="1212" y="424" width="252" height="56" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="1232" y="458" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Warehouse -&gt; Outlets</text>

  <rect x="1180" y="556" width="316" height="328" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1212" y="604" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">OPERATIONS</text>
  <text x="1212" y="644" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600">Audit &amp; Reporting</text>
  <text x="1212" y="684" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">Traceable movement</text>
  <text x="1212" y="712" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">history across purchases,</text>
  <text x="1212" y="740" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="18">transfers, and sales</text>
  <rect x="1212" y="788" width="252" height="56" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="1232" y="822" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Full movement audit</text>
