  <rect x="608" y="296" width="356" height="296" rx="10" fill="#141922" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="640" y="346" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02 / HYBRID ROUTER</text>
  <text x="640" y="388" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Intent Classifier</text>
  <text x="640" y="432" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">Routes lightweight commands</text>
  <text x="640" y="462" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">locally and dispatches multi-step</text>
  <text x="640" y="492" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">reasoning to cloud LLM APIs</text>
  <text x="640" y="554" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CONCEPT ARCHITECTURE</text>

  <!-- Split paths to On-Device vs Cloud -->
  <path d="M964 388 H1016 V324 H1054" stroke="#4ADE80" stroke-width="2.5"/>
  <polygon points="1050,316 1066,324 1050,332" fill="#4ADE80"/>
  <path d="M964 498 H1016 V660 H1054" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="1050,652 1066,660 1050,668" fill="#38BDF8"/>

