  <text x="140" y="286" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Conversational Layer</text>
  <text x="140" y="324" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">Unified voice and text command bar</text>

