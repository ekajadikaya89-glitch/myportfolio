  <rect x="1070" y="196" width="426" height="316" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1104" y="246" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PATH A / ON-DEVICE</text>
  <text x="1104" y="288" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Fast Local Execution</text>
  <text x="1104" y="332" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">Quick device actions, timers,</text>
  <text x="1104" y="362" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">and offline utility triggers</text>
  <rect x="1104" y="416" width="358" height="58" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="1126" y="451" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Low latency · No round-trip</text>

  <!-- Right Bottom: Cloud LLM Path -->
  <rect x="1070" y="556" width="426" height="328" rx="10" fill="#141922" stroke="#252A34" stroke-width="2"/>
  <text x="1104" y="606" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PATH B / CLOUD REASONING</text>
  <text x="1104" y="648" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">LLM &amp; Tool Orchestration</text>
  <text x="1104" y="692" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">Structured tool calls, synthesis,</text>
  <text x="1104" y="722" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="19">and multi-step personal workflows</text>
  <rect x="1104" y="786" width="358" height="58" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="1126" y="821" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Flutter · Dart · Firebase · LLMs</text>
</svg>
