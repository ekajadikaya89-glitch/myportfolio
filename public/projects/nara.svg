  <rect x="240" y="418" width="10" height="76" rx="2" fill="#F5F6F7"/>
  <rect x="264" y="430" width="10" height="52" rx="2" fill="#38BDF8"/>
  <rect x="288" y="440" width="10" height="32" rx="2" fill="#5E6673"/>
  <rect x="312" y="426" width="10" height="60" rx="2" fill="#38BDF8"/>
  <rect x="336" y="436" width="10" height="40" rx="2" fill="#5E6673"/>
