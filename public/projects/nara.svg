  <text x="104" y="104" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="1">SPEC 04 / HYBRID MOBILE ASSISTANT ARCHITECTURE</text>
  <text x="1496" y="104" text-anchor="end" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">NARA (CONCEPT)</text>

