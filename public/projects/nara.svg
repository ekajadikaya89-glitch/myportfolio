  <text x="168" y="404" fill="#9BA1AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">VOICE / TEXT INPUT CAPTURE</text>
  <rect x="168" y="438" width="10" height="36" rx="2" fill="#5E6673"/>
  <rect x="192" y="424" width="10" height="64" rx="2" fill="#38BDF8"/>
