  <rect x="140" y="544" width="344" height="128" rx="8" fill="#141922" stroke="#252A34" stroke-width="1.5"/>
  <text x="168" y="584" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Mobile OS Integrations</text>
  <text x="168" y="618" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">Reminders, calendar intents,</text>
  <text x="168" y="644" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">and everyday utility shortcuts</text>

  <rect x="140" y="706" width="344" height="140" rx="8" fill="#141922" stroke="#252A34" stroke-width="1.5"/>
  <text x="168" y="746" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Firebase Sync Layer</text>
  <text x="168" y="780" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">User preferences, conversation</text>
  <text x="168" y="806" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="17">memory, and cross-device state</text>

  <!-- Arrow to Hybrid Router -->
  <line x1="520" y1="438" x2="592" y2="438" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="588,430 604,438 588,446" fill="#38BDF8"/>

