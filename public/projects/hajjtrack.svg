  <text x="772" y="574" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="20">Device telemetry ingestion, group membership, and status broadcasts</text>
  <rect x="772" y="596" width="154" height="34" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="849" y="619" text-anchor="middle" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">REST API</text>
