  <text x="975" y="352" text-anchor="middle" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Dart</text>
  <rect x="1046" y="328" width="154" height="36" rx="6" fill="#0B0D11" stroke="#363D4B" stroke-width="1.5"/>
  <text x="1123" y="352" text-anchor="middle" fill="#F5F6F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">BLE GATT</text>

