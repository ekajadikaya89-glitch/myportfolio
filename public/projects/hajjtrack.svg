  <rect x="736" y="714" width="760" height="186" rx="10" fill="#0B0D11" stroke="#252A34" stroke-width="2"/>
  <text x="772" y="758" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03 / INCUBATION MILESTONE</text>
  <text x="772" y="796" fill="#F5F6F7" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Infinity Squad / Infinity Rise 2026</text>
  <text x="772" y="834" fill="#9BA1AD" font-family="system-ui, -apple-system, sans-serif" font-size="20">Top 10 selected ecosystem connecting hardware, mobile, and organizers</text>
